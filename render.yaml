# Render Blueprint — one-click deploy of the support console.
# New -> Blueprint -> pick this repo -> paste your GEMINI_API_KEY. That's it.
#
# The hosted demo runs lexical retrieval (no embedding calls -> instant boot) over the
# committed Northwind help centre, with the escalation threshold calibrated on its labelled
# tickets (results/helpdesk/results.json).
#
# Rate limits: each ticket costs ~1 decision call + HDA_SAMPLES reply samples. Gemini's free
# tier allows roughly 10-15 requests/minute for gemini-2.5-flash, so with 5 samples two quick
# tickets can hit HTTP 429. HDA_SAMPLES=3 keeps a ticket under that budget; a paid-tier key can
# go back to 5 (the calibrated setting). When the API does rate-limit, the console says
# "model unavailable" explicitly rather than pretending the agent escalated.
services:
  - type: web
    name: helpdesk-agent
    runtime: python
    plan: free
    buildCommand: "echo 'no build step — standard library only'"
    startCommand: "python serve.py"
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: GEMINI_API_KEY        # set this in the dashboard (secret)
        sync: false
      - key: HDA_RETRIEVER         # lexical: no embedding calls, instant boot
        value: tfidf
      - key: HDA_SAMPLES           # fewer reply samples per ticket for free-tier keys
        value: "3"
      - key: PYTHON_VERSION
        value: "3.12.6"
