[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "helpdesk-agent"
version = "0.1.0"
description = "A customer-support agent that replies only from the help centre, cites the article, and escalates to a human with a calibrated error guarantee."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Aashan Javed" }]
dependencies = []   # pure standard library

[tool.setuptools]
packages = ["helpdesk_agent"]
