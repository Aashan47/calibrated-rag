[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "calibrated-rag"
version = "0.1.0"
description = "A retrieval-QA agent that abstains instead of hallucinating, with conformal-calibrated confidence."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Aashan Javed" }]
dependencies = []   # pure standard library

[tool.setuptools]
packages = ["calibrated_rag"]
